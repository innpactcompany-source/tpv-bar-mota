<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserva tu mesa · Bar Piscina Mota del Cuervo</title>
<meta name="description" content="Reserva tu mesa en el Bar Piscina de Mota del Cuervo. Rápido y sin llamadas.">
<meta property="og:title" content="Reserva tu mesa · Bar Piscina Mota del Cuervo">
<meta property="og:description" content="Reserva en 30 segundos, sin llamadas.">
<meta property="og:type" content="website">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --blue:#1E52D9; --blue-dark:#1642B0; --blue-tint:#F1F5FF; --blue-2:#E1E9FD;
    --blue-line:#CFDCFB; --ink:#14213D; --muted:#7686A6; --white:#FFFFFF;
    --danger:#D64545; --ok:#2F9E44;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:linear-gradient(180deg,#eef3ff,#fbfcff); min-height:100vh; color:var(--ink);
    display:flex; align-items:flex-start; justify-content:center; padding:18px 14px 40px; }
  .card{ width:100%; max-width:440px; background:var(--white); border-radius:20px;
    box-shadow:0 10px 34px rgba(30,82,217,.16); overflow:hidden; }
  .hd{ background:var(--blue); color:#fff; padding:26px 22px 22px; text-align:center; }
  .hd h1{ font-size:25px; font-weight:800; letter-spacing:.4px; }
  .hd p{ font-size:14px; color:#d7e3ff; margin-top:5px; }
  .hd .plazo{ display:inline-block; margin-top:12px; background:rgba(255,255,255,.16);
    padding:5px 13px; border-radius:999px; font-size:12px; font-weight:700; }
  form{ padding:20px 22px 24px; }
  label{ display:block; font-size:12px; font-weight:800; color:var(--muted);
    text-transform:uppercase; letter-spacing:.05em; margin:14px 0 6px; }
  label:first-of-type{ margin-top:0; }
  input,textarea,select{ width:100%; border:2px solid var(--blue-line); border-radius:12px;
    padding:13px; font-size:16px; font-family:inherit; color:var(--ink); background:#fff; }
  input:focus,textarea:focus,select:focus{ outline:none; border-color:var(--blue); }
  textarea{ resize:none; }
  .row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pers{ display:flex; align-items:center; gap:10px; }
  .pers button{ width:46px; height:46px; flex:0 0 auto; border:none; border-radius:12px;
    background:var(--blue-tint); color:var(--blue); font-size:22px; font-weight:800; cursor:pointer; }
  .pers button:active{ background:var(--blue-2); transform:scale(.95); }
  .pers input{ text-align:center; font-weight:800; font-size:19px; }
  .opt{ color:var(--blue-line); font-weight:700; text-transform:none; letter-spacing:0; }
  input.falta,textarea.falta{ border-color:var(--danger); background:#fdf5f5; }
  .send{ width:100%; margin-top:22px; padding:16px; border:none; border-radius:14px;
    background:var(--blue); color:#fff; font-size:17px; font-weight:800; cursor:pointer;
    box-shadow:0 6px 18px rgba(30,82,217,.3); }
  .send:active{ transform:scale(.98); }
  .send:disabled{ opacity:.55; }
  .msg{ margin-top:14px; font-size:14px; font-weight:700; text-align:center; min-height:18px; }
  .msg.err{ color:var(--danger); }
  .legal{ font-size:11px; color:var(--muted); text-align:center; margin-top:14px; line-height:1.5; }
  .ok-box{ padding:34px 24px; text-align:center; }
  .ok-tick{ width:66px; height:66px; margin:0 auto 16px; border-radius:50%;
    background:#eafaf0; color:var(--ok); font-size:34px; font-weight:800;
    display:flex; align-items:center; justify-content:center; }
  .ok-box h2{ font-size:21px; margin-bottom:8px; }
  .ok-box p{ font-size:15px; color:var(--muted); line-height:1.5; }
  .ok-det{ margin-top:18px; background:var(--blue-tint); border-radius:13px; padding:15px; text-align:left; }
  .ok-det div{ display:flex; justify-content:space-between; font-size:14px; padding:4px 0; }
  .ok-det b{ color:var(--blue); }
  .foot{ text-align:center; font-size:11.5px; color:var(--muted); padding:0 22px 20px; line-height:1.5; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="hd">
    <h1>BAR PISCINA</h1>
    <p>Mota del Cuervo · Reserva tu mesa</p>
    <span class="plazo">Reservas hasta el 30 de agosto</span>
  </div>
  <form id="f">
    <label for="nombre">Tu nombre</label>
    <input id="nombre" type="text" maxlength="60" placeholder="Nombre y apellido" required autocomplete="name">

    <div class="row">
      <div>
        <label for="fecha">Día</label>
        <input id="fecha" type="date" required>
      </div>
      <div>
        <label for="hora">Hora</label>
        <input id="hora" type="time" required>
      </div>
    </div>

    <label for="personas">Personas</label>
    <div class="pers">
      <button type="button" id="menos">−</button>
      <input id="personas" type="number" min="1" max="30" value="2" inputmode="numeric">
      <button type="button" id="mas">+</button>
    </div>

    <label for="telefono">Teléfono</label>
    <input id="telefono" type="tel" inputmode="tel" maxlength="20" placeholder="600 123 456" required autocomplete="tel">

    <label for="nota">Comentarios <span class="opt">(opcional)</span></label>
    <textarea id="nota" rows="2" maxlength="200" placeholder="Cumpleaños, sillita para niños, alergias…"></textarea>

    <button class="send" id="send" type="submit">Reservar</button>
    <div class="msg" id="msg"></div>
    <div class="legal">Al reservar aceptas que guardemos estos datos para gestionar tu mesa.
      Asociación Juvenil Junior Empresa Innpact · CIF G75335828</div>
  </form>
</div>

<script>
const SUPABASE_URL = "https://xgtheuslufmgvadrknkh.supabase.co";
const SUPABASE_KEY = "sb_publishable_hwze_N-sgY7eCb2Jr7kHQw_xxsOJHWY";
const FECHA_LIMITE = "2026-08-30";                 // último día reservable

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const hoy = new Date().toISOString().slice(0,10);

$('fecha').min = hoy;
$('fecha').max = FECHA_LIMITE;
$('fecha').value = hoy;

$('menos').onclick = () => { const p=$('personas'); p.value = Math.max(1, (+p.value||1)-1); };
$('mas').onclick   = () => { const p=$('personas'); p.value = Math.min(30, (+p.value||1)+1); };

/* al escribir, quitar la marca roja del campo */
['nombre','telefono','fecha','hora'].forEach(id=>{
  $(id).addEventListener('input', ()=>{ $(id).classList.remove('falta'); $('msg').textContent=''; });
});

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const msg=$('msg'), btn=$('send');
  const nombre=$('nombre').value.trim(), fecha=$('fecha').value, hora=$('hora').value;
  const personas=Math.max(1,Math.min(30, parseInt($('personas').value,10)||1));
  const telefono=$('telefono').value.trim();
  const comentarios=$('nota').value.trim();
  const nota=('Tel: '+telefono+(comentarios?' · '+comentarios:'')).slice(0,200);

  msg.className='msg'; msg.textContent='';
  ['nombre','telefono','fecha','hora'].forEach(id=>$(id).classList.remove('falta'));
  const falta=(id,texto)=>{ const c=$(id); c.classList.add('falta'); msg.className='msg err'; msg.textContent=texto;
    try{ c.focus(); c.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){} };

  if(nombre.length<2){ falta('nombre','Falta tu nombre.'); return; }
  if(!telefono){ falta('telefono','Falta el teléfono.'); return; }
  if(telefono.replace(/\D/g,'').length<9){ falta('telefono','El teléfono no es válido.'); return; }
  if(!fecha){ falta('fecha','Falta el día.'); return; }
  if(fecha<hoy){ falta('fecha','Ese día ya ha pasado.'); return; }
  if(fecha>FECHA_LIMITE){ falta('fecha','Solo aceptamos reservas hasta el 30 de agosto.'); return; }
  if(!hora){ falta('hora','Falta la hora.'); return; }

  btn.disabled=true; msg.textContent='Enviando…';
  try{
    const { error } = await sb.from('reservas').insert({
      fecha, hora, nombre, personas, nota, origen:'web', vista:false
    });
    if(error) throw error;
    // avisar por correo (si falla, la reserva ya está guardada: no molestamos al cliente)
    try{ await sb.functions.invoke('aviso-reserva', { body:{ nombre, fecha, hora, personas, nota, telefono, comentarios } }); }catch(_){}
    exito({nombre,fecha,hora,personas});
  }catch(err){
    btn.disabled=false; msg.className='msg err';
    msg.textContent='No se pudo enviar. Inténtalo de nuevo en un momento.';
    console.error(err);
  }
});

function exito(r){
  const f=new Date(r.fecha+'T00:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('card').innerHTML =
    '<div class="hd"><h1>BAR PISCINA</h1><p>Mota del Cuervo</p></div>'+
    '<div class="ok-box"><div class="ok-tick">✓</div>'+
    '<h2>¡Reserva hecha!</h2>'+
    '<p>Te esperamos, '+r.nombre.split(' ')[0]+'. Si necesitas cambiar algo, avísanos en el bar.</p>'+
    '<div class="ok-det">'+
      '<div><span>Día</span><b>'+f+'</b></div>'+
      '<div><span>Hora</span><b>'+r.hora+'</b></div>'+
      '<div><span>Personas</span><b>'+r.personas+'</b></div>'+
    '</div></div>'+
    '<div class="foot">Asociación Juvenil Junior Empresa Innpact · CIF G75335828</div>';
}
</script>
</body>
</html>
